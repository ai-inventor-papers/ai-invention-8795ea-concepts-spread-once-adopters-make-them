entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r pyproject.toml"
  - path: snapshot/
    delete: redownloadable
    source: "aws s3 sync s3://openalex/data/parquet/sources snapshot/sources --no-sign-request (same for topics, subfields, fields; manifests from https://openalex.s3.amazonaws.com/data/parquet/<entity>/manifest.json) -- or run restore.sh"
  - path: __pycache__/
    delete: regenerable
    source: "created automatically by any python run"
  - path: scan/
    keep: full-corpus scan of 476M snapshot works (17 min; snapshot keeps changing so not exactly reproducible); aggregates + title matches read by every later step
