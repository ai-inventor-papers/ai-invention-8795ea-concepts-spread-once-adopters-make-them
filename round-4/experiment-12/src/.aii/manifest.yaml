entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python=.venv/bin/python -r pyproject.toml"
  - path: dtw_cache/
    delete: regenerable
    source: ".venv/bin/python s5_typology.py --scope dev && .venv/bin/python s5_typology.py --scope heldout"
